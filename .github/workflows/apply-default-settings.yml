name: Apply default game settings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-default-settings.yml'

permissions:
  contents: write

jobs:
  apply-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update defaults
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = [
              ('<input type="checkbox" id="toggleDarkMode">', '<input type="checkbox" id="toggleDarkMode" checked>'),
              ('id="borderThickness" min="1" max="12" step="0.5" value="3"', 'id="borderThickness" min="1" max="12" step="0.5" value="3.5"'),
              ('id="borderThicknessVal">3</span>', 'id="borderThicknessVal">3.5</span>'),
              ('id="playerRotation" min="0" max="100" step="1" value="0"', 'id="playerRotation" min="0" max="100" step="1" value="69"'),
              ('id="playerRotationVal">0%</span>', 'id="playerRotationVal">69%</span>'),
              ('<input type="checkbox" id="togglePlayMode">', '<input type="checkbox" id="togglePlayMode" checked>'),
              ('id="rocketSize" min="0.5" max="3" step="0.1" value="1"', 'id="rocketSize" min="0.5" max="3" step="0.1" value="1.4"'),
              ('id="rocketSizeVal">1.0</span>', 'id="rocketSizeVal">1.4</span>'),
              ('id="dustAmount" min="0" max="500" step="10" value="100"', 'id="dustAmount" min="0" max="500" step="10" value="200"'),
              ('id="dustAmountVal">100</span>', 'id="dustAmountVal">200</span>'),
              ('id="paddleSize" min="20" max="120" step="5" value="60"', 'id="paddleSize" min="20" max="120" step="5" value="115"'),
              ('id="paddleSizeVal">60</span>', 'id="paddleSizeVal">115</span>'),
              ('id="paddleWidth" min="4" max="16" step="1" value="8"', 'id="paddleWidth" min="4" max="16" step="1" value="9"'),
              ('id="paddleWidthVal">8</span>', 'id="paddleWidthVal">9</span>'),
              ('id="nameSize" min="4" max="20" step="1" value="7"', 'id="nameSize" min="4" max="20" step="1" value="12"'),
              ('id="nameSizeVal">7</span>', 'id="nameSizeVal">12</span>'),
              ("speed: 4, paddleLen: 60, aiDiff: 6, paddleWidth: 8, rocketScale: 1, dustCount: 100,", "speed: 4, paddleLen: 115, aiDiff: 6, paddleWidth: 9, rocketScale: 1.4, dustCount: 200,"),
              ("nameSize: 7, shakeIntensity: 8, shakeEnabled: true,", "nameSize: 12, shakeIntensity: 8, shakeEnabled: true,"),
              ("borderWhite: false, borderThickness: 3, playerRotation: 0,", "borderWhite: false, borderThickness: 3.5, playerRotation: 69,"),
              ("bg: '#e8e8e8', border: '#000000',\n};", "bg: '#111118', border: '#2a2a3a',\n  darkMode: true,\n};"),
              ("const SAVE_KEY = 'iranPongSettings';", "const SAVE_KEY = 'iranPongSettingsV2';"),
              ("soundVolume: ['soundVolume', 'soundVolumeVal', v => Math.round(parseFloat(v) * 100).toString()],", "soundVolume: ['soundVolume', 'soundVolumeVal', v => Math.round(parseFloat(v)).toString()],"),
              ("cfg.darkMode = false;", "cfg.darkMode = true;"),
              ("// Load saved settings if available\nif (loadCfgFromStorage()) {\n  applyCfgToUI();\n}\nbuildShape();", "// Load saved settings if available, then always sync defaults/settings to the controls\nloadCfgFromStorage();\napplyCfgToUI();\nbuildShape();"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          path.write_text(text)

      - name: Commit changes
        run: |
          rm .github/workflows/apply-default-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set screenshot settings as defaults"
          git push origin main
